name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: "22"
  WAILS_VERSION: v2.15.0

jobs:
  cli:
    name: Build CLI (Cross-Platform)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Run tests
        run: go test -v ./internal/...

      - name: Build CLI binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          build_asset() {
            local goos="$1"
            local goarch="$2"
            local ext="$3"
            local label="$4"
            local name="RealiTLScanner-${version}-cli-${label}"
            local pkg="dist/${name}"

            echo "==> Building ${name} (${goos}/${goarch})"
            mkdir -p "${pkg}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w" -o "${pkg}/RealiTLScanner${ext}" ./cmd/cli
            cp README.md LICENSE "${pkg}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${pkg}" && zip -9 -q "../${name}.zip" ./*)
            else
              tar -C "${pkg}" -czf "dist/${name}.tar.gz" .
            fi
            rm -rf "${pkg}"
          }

          build_asset windows 386 .exe windows-x86
          build_asset windows amd64 .exe windows-x64
          build_asset windows arm64 .exe windows-arm64
          build_asset darwin amd64 "" macos-intel
          build_asset darwin arm64 "" macos-apple-silicon
          build_asset linux 386 "" linux-x86
          build_asset linux amd64 "" linux-x64
          build_asset linux arm64 "" linux-arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  desktop-windows:
    name: Build Desktop GUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Run tests
        run: go test -v ./internal/...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build portable Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wails build -platform windows/amd64 -s -ldflags "-s -w"
          if (-not (Test-Path "build/bin/RealiTLScanner.exe")) {
            throw "Wails did not produce build/bin/RealiTLScanner.exe"
          }

          $version = $env:GITHUB_REF_NAME
          $pkg = "dist/pkg-win-gui"
          New-Item -ItemType Directory -Force -Path $pkg, dist | Out-Null
          Copy-Item "build/bin/RealiTLScanner.exe" "$pkg/"
          Copy-Item "README.md","LICENSE" "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/RealiTLScanner-$version-windows-x64-gui.zip" -Force
          Remove-Item -Recurse -Force $pkg

      - name: Try install NSIS
        continue-on-error: true
        run: choco install nsis -y --no-progress

      - name: Try build NSIS installer
        continue-on-error: true
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -s -nsis -ldflags "-s -w"
          $version = $env:GITHUB_REF_NAME
          Get-ChildItem -Path "build/bin" -Filter "*installer*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist/RealiTLScanner-$version-windows-x64-gui-installer.exe"
          }

      - name: Build Windows WebUI fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME
          $pkg = "dist/pkg-win-webui"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          go build -trimpath -ldflags="-s -w" -o "$pkg/RealiTLScanner-webui.exe" ./cmd/desktop
          Copy-Item "frontend/fallback.html","README.md","LICENSE" "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/RealiTLScanner-$version-windows-x64-webui.zip" -Force
          Remove-Item -Recurse -Force $pkg

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-artifacts
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  desktop-macos:
    name: Build Desktop GUI (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Run tests
        run: go test -v ./internal/...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build native macOS GUI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          build_app() {
            local platform="$1"
            echo "==> wails build -platform ${platform}"
            wails build -platform "${platform}" -s -ldflags "-s -w"
          }

          if ! build_app darwin/universal; then
            echo "Universal build failed; falling back to darwin/arm64"
            build_app darwin/arm64
          fi

          app_path=""
          if [ -d "build/bin/RealiTLScanner.app" ]; then
            app_path="build/bin/RealiTLScanner.app"
          else
            app_path="$(find build/bin -maxdepth 2 -name '*.app' -type d | head -n 1 || true)"
          fi

          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "Wails did not produce a .app bundle" >&2
            ls -la build/bin || true
            exit 1
          fi

          app_name="$(basename "${app_path}")"
          (cd "$(dirname "${app_path}")" && zip -r -9 "../../dist/RealiTLScanner-${version}-macos-universal-gui.zip" "${app_name}")
          tar -czf "dist/RealiTLScanner-${version}-macos-universal-gui.tar.gz" -C "$(dirname "${app_path}")" "${app_name}"

      - name: Build macOS WebUI fallback
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist/pkg-mac-webui
          go build -trimpath -ldflags="-s -w" -o dist/pkg-mac-webui/RealiTLScanner-webui ./cmd/desktop
          cp frontend/fallback.html README.md LICENSE dist/pkg-mac-webui/
          tar -C dist/pkg-mac-webui -czf "dist/RealiTLScanner-${version}-macos-webui.tar.gz" .
          rm -rf dist/pkg-mac-webui

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [cli, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare Release Directory & Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find dist-artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' \) -exec cp {} release-dist/ \;
          if [ -z "$(ls -A release-dist)" ]; then
            echo "No release assets found" >&2
            find dist-artifacts -type f || true
            exit 1
          fi
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          cat > RELEASE_NOTES.md <<EOF
          # RealiTLScanner ${version} 发布说明

          欢迎使用 **RealiTLScanner ${version}**！本版本带来了全新的现代化跨平台原生桌面应用程序（GUI）以及解耦优化的命令行版本（CLI）。

          ---

          ### 📦 资产下载指南 (Assets Guide)

          #### 1. 桌面图形化版本 (Desktop GUI) - 推荐普通用户
          - **Windows (x64)**:
            - \`RealiTLScanner-${version}-windows-x64-gui.zip\`：绿色便携版，解压后双击 \`RealiTLScanner.exe\` 即可运行。
            - \`RealiTLScanner-${version}-windows-x64-gui-installer.exe\`：Windows 安装包（如生成）。
          - **macOS**:
            - \`RealiTLScanner-${version}-macos-universal-gui.zip\` / \`.tar.gz\`：解压后将 \`RealiTLScanner.app\` 拖入 Applications 即可。
            - *提示*：macOS 初次打开如提示损坏或无法验证开发者，请在终端执行：\`xattr -dr com.apple.quarantine /Applications/RealiTLScanner.app\`

          #### 2. 命令行工具 (CLI) - 推荐服务器 / 脚本自动化
          - **Windows**: \`RealiTLScanner-${version}-cli-windows-x64.zip\` / \`x86\` / \`arm64\`
          - **Linux**: \`RealiTLScanner-${version}-cli-linux-x64.tar.gz\` / \`arm64\` / \`x86\`
          - **macOS**: \`RealiTLScanner-${version}-cli-macos-apple-silicon.tar.gz\` / \`macos-intel.tar.gz\`

          #### 3. 浏览器回退版本 (WebUI Fallback)
          - \`RealiTLScanner-${version}-*-webui.*\`：适用于无原生 GUI 环境时在浏览器中打开使用。

          ---

          ### 🌟 主要特性 (Highlights)
          - **全新暗黑现代化 UI**：采用 Dark Slate & Emerald 极客美学界面，流畅动效与直观交互。
          - **全功能控制面板**：支持单目标 IP/CIDR/域名、本地文件批量导入、网页镜像站自动爬取。
          - **BGP / ASN / Nearby 智能扩散**：自动根据种子 IP 追溯 BGP 宣告前缀与 ASN 自治域。
          - **实时仪表盘与日志流**：实时监控探测速率、扫描进度、命中结果，支持关键词即时过滤与双击复制。
          - **内置 GeoIP 支持**：界面感知数据库状态，支持一键自动下载 MaxMind Country.mmdb。
          - **优雅停止与结果持久化**：随扫随存为标准 11 列 CSV 文件，中断扫描不丢数据。

          ---

          详细使用说明请参阅仓库 [README.md](https://github.com/${{ github.repository }})。
          完整 SHA256 校验和见下方的 \`SHA256SUMS.txt\` 文件。
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "RealiTLScanner ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-dist/* \
              --title "RealiTLScanner ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

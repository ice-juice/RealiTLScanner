name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  cli:
    name: CLI (cross-platform)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run tests
        run: go test ./...

      - name: Build CLI assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          build_asset() {
            local goos="$1"
            local goarch="$2"
            local ext="$3"
            local label="$4"
            local name="RealiTLScanner-${version}-${label}"
            local pkg="dist/${name}"

            mkdir -p "${pkg}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w" -o "${pkg}/RealiTLScanner${ext}" ./cmd/cli
            cp README.md LICENSE "${pkg}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${pkg}" && zip -9 -q "../${name}.zip" ./*)
            else
              tar -C "${pkg}" -czf "dist/${name}.tar.gz" .
            fi
          }

          build_asset windows 386 .exe windows-x86
          build_asset windows amd64 .exe windows-x64
          build_asset windows arm64 .exe windows-arm64
          build_asset darwin amd64 "" macos-intel
          build_asset darwin arm64 "" macos-apple-silicon
          build_asset linux 386 "" linux-x86
          build_asset linux amd64 "" linux-x64
          build_asset linux arm64 "" linux-arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            dist/*.zip
            dist/*.tar.gz

  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build native desktop
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wails build -platform windows/amd64 -nsis -ldflags "-s -w"
          if (Test-Path build/bin) {
            Copy-Item -Recurse build/bin dist/wails-windows
          }
          go build -trimpath -ldflags="-s -w" -o dist/RealiTLScanner-desktop.exe ./cmd/desktop
          Compress-Archive -Path dist/RealiTLScanner-desktop.exe,README.md,LICENSE,frontend/fallback.html -DestinationPath dist/RealiTLScanner-${{ github.ref_name }}-windows-desktop-portable.zip

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*.zip
            dist/wails-windows/**

  desktop-macos:
    name: Desktop macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build native desktop
        run: |
          mkdir -p dist/pkg
          wails build -platform darwin/universal -ldflags "-s -w"
          if [ -d build/bin ]; then cp -R build/bin dist/wails-macos; fi
          go build -trimpath -ldflags="-s -w" -o dist/pkg/RealiTLScanner-desktop ./cmd/desktop
          cp README.md LICENSE dist/pkg/
          tar -C dist/pkg -czf dist/RealiTLScanner-${GITHUB_REF_NAME}-macos-desktop-portable.tar.gz .
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            dist/*.tar.gz
            dist/wails-macos/**

  release:
    name: Publish GitHub Release
    needs: [cli, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Changes

          - Split the scanner into `internal/scan` + `cmd/cli` + `cmd/desktop`.
          - CLI flags, defaults, and the 11-column CSV header are unchanged.
          - Native Wails desktop window on Windows and macOS, plus a browser HTTP fallback.

          ## Assets

          - CLI zip/tar.gz for Windows, macOS, and Linux
          - Windows desktop portable zip (and NSIS installer when Wails build succeeds)
          - macOS desktop portable archive (and .app/.dmg when Wails build succeeds)

          See `SHA256SUMS.txt` for checksums.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/**/*.zip \
            dist/**/*.tar.gz \
            dist/*.zip \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --title "RealiTLScanner ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

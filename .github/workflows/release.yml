name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run tests
        run: go test ./...

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          build_asset() {
            local goos="$1"
            local goarch="$2"
            local ext="$3"
            local name="RealiTLScanner-${version}-${goos}-${goarch}"
            local pkg="dist/${name}"

            mkdir -p "${pkg}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w" -o "${pkg}/RealiTLScanner${ext}" .
            cp README.md LICENSE "${pkg}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${pkg}" && zip -9 -q "../${name}.zip" ./*)
            else
              tar -C "${pkg}" -czf "dist/${name}.tar.gz" .
            fi
          }

          build_asset windows 386 .exe
          build_asset windows amd64 .exe
          build_asset windows arm64 .exe
          build_asset darwin amd64 ""
          build_asset darwin arm64 ""
          build_asset linux 386 ""
          build_asset linux amd64 ""
          build_asset linux arm64 ""

          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Changes

          - Fix CSV output escaping so issuers containing commas no longer shift the `GEO_CODE` column.
          - Filter certificate domains to valid SAN DNS names instead of using Common Name fallback values.
          - Deduplicate scanner output by normalized certificate domain.
          - Add tests for CSV escaping, output flushing, domain filtering, and domain deduplication.

          ## Assets

          - Windows: 386, amd64, arm64
          - macOS: amd64 (Intel), arm64 (Apple Silicon)
          - Linux: 386, amd64, arm64

          See `SHA256SUMS.txt` for checksums.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --title "RealiTLScanner ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
